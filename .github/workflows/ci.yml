name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint + spell + link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !.private/**
            !CLAUDE.md

      - name: spell check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: |
            **/*.md
          config: .cspell.json
          incremental_files_only: false

      - name: link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --max-retries 3
            --accept 200,429,503
            --exclude-path .private
            --no-progress
            './**/*.md'
          fail: true

  demo:
    name: confused-deputy demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vulnerable demo prints EXFILTRATED
        run: |
          out=$(python3 demos/01-confused-deputy/demo.py)
          echo "$out"
          echo "$out" | grep -q "^EXFILTRATED " \
            || { echo "expected EXFILTRATED token in stdout"; exit 1; }
      - name: mitigated demo prints REFUSED
        run: |
          out=$(python3 demos/01-confused-deputy/demo_fixed.py)
          echo "$out"
          echo "$out" | grep -q "^REFUSED:" \
            || { echo "expected REFUSED token in stdout"; exit 1; }
          echo "$out" | grep -q "EXFILTRATED" \
            && { echo "mitigated demo must not exfiltrate"; exit 1; } \
            || true
